name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-android

    steps:
      # fetch-depth: 0 是必需的：versionCode 取 git rev-list --count HEAD，
      # 默认的浅克隆（depth=1）会让提交数恒为 1，版本号就不动了。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest 镜像已预装 Android SDK（ANDROID_HOME），不再用 setup-android：
      # 它默认执行 `sdkmanager tools`，新版 cmdline-tools 已无该包，会直接失败。
      - name: Check Android SDK
        run: |
          test -n "$ANDROID_HOME" || { echo "::error::ANDROID_HOME 未设置"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -5 || true

      # 有签名 secrets 时打正式签名包；没有时退回 debug 签名（仍可安装）
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WANLI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WANLI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WANLI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WANLI_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ../wanli-release.keystore
            {
              echo "WANLI_STORE_FILE=$(pwd)/../wanli-release.keystore"
              echo "WANLI_STORE_PASSWORD=$STORE_PASSWORD"
              echo "WANLI_KEY_ALIAS=$KEY_ALIAS"
              echo "WANLI_KEY_PASSWORD=$KEY_PASSWORD"
            } >> local.properties
            echo "::notice::使用正式 keystore 签名"
          else
            echo "::warning::未配置签名 secrets，release 包将使用 debug 签名"
          fi

      # 版本号：versionCode 统一取「提交数」git rev-list --count HEAD，每次提交 +1。
      # tag 构建与 main 构建共用同一条单调序列：此前用 run_number 时两条序列各自递增，
      # 出现过 tag 的 versionCode 反而小于之前的 main 构建，导致 latest 通道落后于正式版。
      # versionName：tag 用 tag 名（去掉 v）；main 用 1.0.<提交数>，每次提交升一个小版本。
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          COUNT=$(git rev-list --count HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${COUNT}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "版本：$NAME ($COUNT)"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -Pwanli.versionCode=${{ steps.version.outputs.code }} \
            -Pwanli.versionName=${{ steps.version.outputs.name }}

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          APK="wanli-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "out/$APK"
          cp "out/$APK" out/wanli-latest.apk

          SHA256=$(sha256sum "out/$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "out/$APK")
          # latest 通道只保留滚动文件名，避免每次构建堆积资源
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            ASSET="wanli-latest.apk"
          else
            ASSET="$APK"
          fi
          cat > out/version.json <<EOF
          {
            "version_code": ${{ steps.version.outputs.code }},
            "version_name": "${{ steps.version.outputs.name }}",
            "asset": "$ASSET",
            "sha256": "$SHA256",
            "size": $SIZE,
            "commit": "${GITHUB_SHA::7}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat out/version.json
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wanli-apk
          path: frontend-android/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # tag 发正式 Release；push main 更新滚动的 latest 预发布
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" out/wanli-*.apk out/version.json \
              --title "$GITHUB_REF_NAME" \
              --notes "自动构建：$GITHUB_REF_NAME（${GITHUB_SHA::7}）" \
              --verify-tag
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            if ! gh release view latest >/dev/null 2>&1; then
              gh release create latest \
                --target "$GITHUB_SHA" \
                --title "最新构建（main）" \
                --prerelease \
                --notes "跟随 main 分支最新提交自动构建。"
            fi
            gh release upload latest out/wanli-latest.apk out/version.json --clobber
            gh release edit latest \
              --target "$GITHUB_SHA" \
              --notes "跟随 main 分支最新提交自动构建：${GITHUB_SHA::7}"
          fi
