name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest 镜像已预装 Android SDK（ANDROID_HOME），不再用 setup-android：
      # 它默认执行 `sdkmanager tools`，新版 cmdline-tools 已无该包，会直接失败。
      - name: Check Android SDK
        run: |
          test -n "$ANDROID_HOME" || { echo "::error::ANDROID_HOME 未设置"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -5 || true

      # 有签名 secrets 时打正式签名包；没有时退回 debug 签名（仍可安装）
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WANLI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WANLI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WANLI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WANLI_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ../wanli-release.keystore
            {
              echo "WANLI_STORE_FILE=$(pwd)/../wanli-release.keystore"
              echo "WANLI_STORE_PASSWORD=$STORE_PASSWORD"
              echo "WANLI_KEY_ALIAS=$KEY_ALIAS"
              echo "WANLI_KEY_PASSWORD=$KEY_PASSWORD"
            } >> local.properties
            echo "::notice::使用正式 keystore 签名"
          else
            echo "::warning::未配置签名 secrets，release 包将使用 debug 签名"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
            "out/wanli-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wanli-apk
          path: frontend-android/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # tag 发正式 Release；push main 更新滚动的 latest 预发布
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" out/*.apk \
              --title "$GITHUB_REF_NAME" \
              --notes "自动构建：$GITHUB_REF_NAME（${GITHUB_SHA::7}）" \
              --verify-tag
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            cp out/*.apk out/wanli-latest.apk
            if ! gh release view latest >/dev/null 2>&1; then
              gh release create latest \
                --target "$GITHUB_SHA" \
                --title "最新构建（main）" \
                --prerelease \
                --notes "跟随 main 分支最新提交自动构建。"
            fi
            gh release upload latest out/wanli-latest.apk --clobber
            gh release edit latest \
              --target "$GITHUB_SHA" \
              --notes "跟随 main 分支最新提交自动构建：${GITHUB_SHA::7}"
          fi
